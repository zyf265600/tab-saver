<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Tab Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="icons/icon128.png" alt="">
      <div>
        <h1>Tab Saver</h1>
        <p class="tagline">闲置标签页自动休眠</p>
      </div>
    </div>
    <div class="stat" title="当前处于休眠状态的标签页">
      <span class="stat-num" id="sleepingCount">0</span>
      <span class="stat-label">已休眠</span>
    </div>
  </header>

  <main>
    <section class="actions">
      <button type="button" class="btn-action" id="sleepWindow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg>
        <span class="action-text">
          <span class="action-title">休眠当前窗口</span>
          <span class="action-sub" id="windowSub">其他标签页</span>
        </span>
      </button>
      <button type="button" class="btn-action" id="sleepAll">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="14" height="13" rx="3"/><path d="M17 20H6a3 3 0 0 1-3-3V8"/></svg>
        <span class="action-text">
          <span class="action-title">休眠所有窗口</span>
          <span class="action-sub" id="allSub">全部标签页</span>
        </span>
      </button>
      <button type="button" class="btn-action" id="wakeWindow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="action-text">
          <span class="action-title">唤醒当前窗口</span>
          <span class="action-sub" id="wakeWindowSub">休眠的标签页</span>
        </span>
      </button>
      <button type="button" class="btn-action" id="wakeAll">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4"/><path d="M7 16a5 5 0 0 1 10 0"/><path d="M3 20h18"/></svg>
        <span class="action-text">
          <span class="action-title">唤醒所有窗口</span>
          <span class="action-sub" id="wakeAllSub">全部休眠的</span>
        </span>
      </button>
    </section>
    <div class="toast" id="toast" role="status"></div>

    <section class="card">
      <div class="card-head">
        <h2>休眠时间</h2>
        <span class="saved" id="savedBadge">已保存</span>
      </div>
      <div class="time-display">
        <span class="time-value" id="timeValue">30</span>
        <span class="time-unit" id="timeUnit">分钟</span>
      </div>
      <input type="range" id="timeSlider" min="0" max="10" step="1" value="4" aria-label="休眠时间">
      <div class="scale">
        <span>5 分钟</span><span>1 小时</span><span>4 小时</span>
      </div>
      <p class="hint" id="timeHint">标签页超过 30 分钟没有被查看，就会自动休眠。</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>白名单</h2>
        <span class="count" id="wlCount">0</span>
      </div>
      <form class="add-row" id="addForm" autocomplete="off">
        <input type="text" id="domainInput" placeholder="输入网站，如 github.com" spellcheck="false">
        <button type="submit" class="btn-primary">添加</button>
      </form>
      <p class="error" id="errorMsg"></p>
      <button type="button" class="btn-current" id="addCurrent" hidden>
        <img class="favicon" id="currentFavicon" alt="">
        <span>添加当前网站 <b id="currentDomain"></b></span>
      </button>
      <ul class="wl-list" id="wlList"></ul>
      <div class="empty" id="wlEmpty">
        白名单里的网站永远不会被休眠，<br>适合放邮箱、在线文档、音乐播放器。
      </div>
    </section>
  </main>

  <footer class="footer">
    当前标签页、固定标签页、正在播放声音的标签页不会被休眠
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
